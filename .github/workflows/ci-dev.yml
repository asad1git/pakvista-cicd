name: CI – Development Environment

on:
  pull_request:
    branches:
      - develop

jobs:
  ci-dev:
    name: Build & Push Docker Image (dev)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linting Tools
        run: npm install -g htmlhint stylelint stylelint-config-standard

      - name: Lint HTML Files
        run: htmlhint "*.html" || true

      - name: Lint CSS File
        run: |
          echo '{"extends":["stylelint-config-standard"]}' > .stylelintrc.json
          stylelint "style.css" || true

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/pakvista"
          docker build -t $IMAGE:dev-latest -t $IMAGE:dev-$SHORT_SHA .
          docker push $IMAGE:dev-latest
          docker push $IMAGE:dev-$SHORT_SHA
          echo "✅ Pushed $IMAGE:dev-latest and $IMAGE:dev-$SHORT_SHA"
