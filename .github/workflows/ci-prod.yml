name: CI – Production Environment

# Trigger: fires on every Pull Request targeting the "main" branch
on:
  pull_request:
    branches:
      - main

jobs:
  ci-prod:
    name: Build & Push Docker Image (prod)
    runs-on: ubuntu-latest

    steps:
      # Step 1 – Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2 – Lint HTML and CSS
      - name: Install Linting Tools
        run: |
          npm install -g htmlhint stylelint stylelint-config-standard

      - name: Lint HTML Files
        run: |
          htmlhint "*.html" || true

      - name: Lint CSS File
        run: |
          echo '{"extends":["stylelint-config-standard"]}' > .stylelintrc.json
          stylelint "style.css" || true

      # Step 3 – Docker Login
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 4 – Build Docker image (no push yet)
      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pakvista:prod-latest

      # Step 5 – Tag image with commit SHA
      - name: Tag Image with Commit SHA
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/pakvista:prod-latest \
                       -t ${{ secrets.DOCKERHUB_USERNAME }}/pakvista:prod-$SHORT_SHA .
          echo "Tagged: prod-latest and prod-$SHORT_SHA"

      # Step 6 – Push image to Docker Hub
      - name: Push Docker Image to Docker Hub
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/pakvista:prod-latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/pakvista:prod-$SHORT_SHA
          echo "✅ Prod image pushed: prod-latest and prod-$SHORT_SHA"
